<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768" role="img" aria-label="Illustration of removals truck and moving boxes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2b33"/>
      <stop offset="100%" stop-color="#08323d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Road -->
  <rect x="0" y="560" width="1366" height="120" fill="#0a1b20"/>
  <rect x="80" y="616" width="1206" height="8" fill="#27434c" opacity="0.9"/>

  <!-- Boxes -->
  <g transform="translate(220,470)" filter="url(#shadow)">
    <rect x="0" y="50" width="90" height="70" rx="6" fill="#caa074"/>
    <rect x="14" y="62" width="62" height="8" fill="#b68f64"/>
    <rect x="110" y="30" width="90" height="90" rx="6" fill="#ddb98e"/>
    <rect x="124" y="42" width="62" height="8" fill="#c9a478"/>
    <rect x="220" y="0" width="100" height="120" rx="6" fill="#caa074"/>
    <rect x="236" y="14" width="68" height="8" fill="#b68f64"/>
  </g>

  <!-- Moving Truck -->
  <g transform="translate(540,430)" filter="url(#shadow)">
    <!-- Cabin -->
    <rect x="0" y="80" width="180" height="90" rx="10" fill="#fd5523"/>
    <rect x="20" y="92" width="70" height="40" rx="6" fill="#ffd8cc"/>
    <rect x="100" y="92" width="60" height="40" rx="6" fill="#ffd8cc"/>
    <rect x="140" y="134" width="24" height="18" fill="#e64c1f"/>

    <!-- Cargo Box -->
    <rect x="170" y="40" width="420" height="130" rx="10" fill="#ffffff"/>
    <rect x="170" y="40" width="420" height="28" rx="10" fill="#e8f1f3"/>
    <text x="380" y="118" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#0a2e39">We One Removals</text>
    <text x="380" y="146" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="16" fill="#4a6970">Diss • Norfolk • Suffolk</text>

    <!-- Wheels -->
    <g>
      <circle cx="110" cy="190" r="34" fill="#1b2d33"/>
      <circle cx="110" cy="190" r="16" fill="#8aa3a9"/>
      <circle cx="470" cy="190" r="34" fill="#1b2d33"/>
      <circle cx="470" cy="190" r="16" fill="#8aa3a9"/>
    </g>
  </g>

  <!-- Title watermark -->
  <text x="50%" y="110" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff" opacity="0.15">Your Complete Moving Checklist</text>
</svg>

